name: Build Rasputim Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'core/**'
      - 'assets/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/build-windows.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck, build React and run tests
        run: npm run verify
      - name: Install Electron packaging toolchain
        shell: pwsh
        run: npm install --no-save --package-lock=false electron@28.3.3 @electron/packager@18.3.2
      - name: Package Windows x64
        run: npm run build:windows
      - name: Create release archive
        shell: pwsh
        run: |
          $folder = Get-ChildItem dist -Directory | Select-Object -First 1
          if (-not $folder) { throw 'Build folder not found.' }
          $zip = Join-Path dist 'Rasputim-Tecnologis-v0.5.0-Windows-x64.zip'
          Compress-Archive -Path (Join-Path $folder.FullName '*') -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rasputim-Tecnologis-v0.5.0-Windows-x64
          path: dist/Rasputim-Tecnologis-v0.5.0-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
