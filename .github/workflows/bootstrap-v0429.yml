name: Bootstrap Rasputim v0.4.29

on:
  workflow_dispatch:
  push:
    branches:
      - release/v0.4.29-github-ai-local
    paths:
      - 'release/parts/**'
      - '.github/workflows/bootstrap-v0429.yml'

permissions:
  contents: write

jobs:
  migrate-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.4.29-github-ai-local
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild and expand validated source
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'release/parts/*.b64' | Sort-Object Name
          if (-not $parts) { throw 'Source parts not found.' }
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          $archive = Join-Path $env:RUNNER_TEMP 'Rasputim-Tecnologis-v0.4.29-source.zip'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($base64))
          $temp = Join-Path $env:RUNNER_TEMP 'rasputim-v0429-source'
          Remove-Item $temp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $temp | Out-Null
          Expand-Archive -Path $archive -DestinationPath $temp -Force
          git rm -r --ignore-unmatch .
          Get-ChildItem -Path $temp -Force | ForEach-Object {
            Copy-Item $_.FullName -Destination $PWD -Recurse -Force
          }

      - name: Install dependencies
        run: npm ci

      - name: Verify v0.4.29
        run: npm run verify

      - name: Commit clean Electron source tree
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'No migration changes to commit.'
            exit 0
          }
          git commit -m 'release: migrate Rasputim desktop to v0.4.29 Electron'
          git push origin HEAD:release/v0.4.29-github-ai-local
